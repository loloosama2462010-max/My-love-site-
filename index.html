<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Abrahem ❤️</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffd6e7, #d8c4ff);
      color: #4b2948;
    }

    .card {
      width: 85%;
      max-width: 500px;
      padding: 35px 20px;
      background: rgba(255,255,255,0.75);
      border-radius: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .heart {
      font-size: 55px;
      animation: beat 1s infinite;
    }

    p {
      font-size: 19px;
      line-height: 1.7;
    }

    button {
      border: none;
      padding: 13px 25px;
      border-radius: 30px;
      background: #ff6f9f;
      color: white;
      font-size: 17px;
      cursor: pointer;
      margin-top: 15px;
    }

    #message {
      display: none;
      margin-top: 20px;
    }

    @keyframes beat {
      50% {
        transform: scale(1.2);
      }
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="heart">❤️</div>

    <h1>Abrahem</h1>

    <p>
      You are a very special person to me.
      <br>
      Thank you for being part of my life. 🤍
    </p>

    <button onclick="showMessage()">اضغط هنا ❤️</button>

    <p id="message">
      مهما حصل، هتفضل شخص غالي ومميز عندي. 🌷
      <br>
      This little website is just for you. ❤️
    </p>
  </div>

  <script>
    function showMessage() {
      document.getElementById("message").style.display = "block";
    }
  </script>

</body>
</html>
